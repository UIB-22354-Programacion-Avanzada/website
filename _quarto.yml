project:
  type: website

website:
  page-navigation: false
  title: "Programación Avanzada (22354)"
  description: "Material docente de la asignatura Programación Avanzada (22354), UIB-EPS."
  site-url: "https://uib-22354-programacion-avanzada.github.io/website/"

  open-graph: true

  page-footer:
    right: "Esta página está construida con [sta210-s22](https://github.com/sta210-s22) y [Quarto](https://quarto.org/)."
